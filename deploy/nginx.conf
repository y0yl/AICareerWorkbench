# /etc/nginx/sites-available/epoch  （把 your-domain.com 换成你的域名）
# 申请证书：sudo certbot --nginx -d your-domain.com
server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # certbot 会自动填写以下两行
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    client_max_body_size 4m;
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # 静态资源由 nginx 直接提供（更快），字体长缓存
    root /opt/epoch/web;
    location /fonts/ { expires 1y; add_header Cache-Control "public, immutable"; }

    # API（含 SSE 流式输出：必须关闭缓冲）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
